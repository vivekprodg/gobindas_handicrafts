{% load humanize %}

<ul class="tax-breakdown-list">
    {% for line in tax_lines %}
    <li style="display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.85rem;">
        <span>{{ line.name }}</span>
        <strong>US$ {{ line.tax_amount|floatformat:2|intcomma }}</strong>
    </li>
    {% endfor %}
</ul>
