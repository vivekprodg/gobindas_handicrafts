<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FCFAF8; color: #1A1512; margin: 0; padding: 20px; }
        .email-container { max-width: 600px; background: #FFFFFF; border: 1px solid #EAE5E0; border-radius: 8px; padding: 30px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 2px solid #C5A880; padding-bottom: 15px; margin-bottom: 25px; }
        .footer { text-align: center; font-size: 12px; color: #7A726A; margin-top: 30px; border-top: 1px solid #EAE5E0; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h2 style="font-family: 'Cinzel', serif; color: #1A1512; margin: 0;">GOBINDAS HANDICRAFTS</h2>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; {% now "Y" %} Gobindas Handicrafts. All rights reserved.
        </div>
    </div>
</body>
</html>
