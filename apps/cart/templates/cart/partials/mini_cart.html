{% load static cart_tags humanize %}

<div class="mini-cart-wrapper" data-mini-cart>
    <a href="{% url 'cart:cart_detail' %}" class="mini-cart-link" aria-label="Shopping Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="mini-cart-count" data-cart-count>{{ cart_count|default:0 }}</span>
    </a>

    <div class="mini-cart-dropdown">
        <div class="mini-cart-content" data-mini-cart-content>
            {% include "cart/partials/mini_cart_content.html" %}
        </div>
    </div>
</div>
